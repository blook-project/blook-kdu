# blook-kdu CI.
#
# - build:            user-mode tools + CLI + host unit tests
# - payload:          kernel payload driver (WDK) with real blook-kchannel sources
# - format:           clang-format check
# - exploit-tests:    one independent job per exploit (matrix from the registry)
#
# blook-kchannel is pinned: all driver IPC must go through real upstream sources.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  KCHANNEL_REPO: https://github.com/blook-project/blook-kchannel
  KCHANNEL_COMMIT: 40a5337a2d69c79fb049361f616aacc58ae75d4d
  DRVLITE_REPO: https://github.com/blook-project/blook-drv-lite
  DRVLITE_COMMIT: e8d096b56f160637bf1c268a6780a43240fa5f37
  WDK_VERSION: 10.0.26100.6584

jobs:
  exploit-list:
    name: discover exploits
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: pwsh
        run: |
          $json = & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/list-exploits.ps1
          Write-Host "exploit matrix: $json"
          "matrix=$json" >> $env:GITHUB_OUTPUT

  install-toolchain:
    name: install WDK
    runs-on: windows-latest
    steps:
      - name: Cache WDK NuGet content
        id: cache-wdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\wdk\c
          key: wdk-${{ env.WDK_VERSION }}
      - name: Download WDK from NuGet
        if: steps.cache-wdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\wdk" | Out-Null
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$env:WDK_VERSION/microsoft.windows.wdk.x64.$env:WDK_VERSION.nupkg"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\wdk\wdk.nupkg"
          tar.exe -xf "$env:RUNNER_TEMP\wdk\wdk.nupkg" -C "$env:RUNNER_TEMP\wdk"
      - name: Verify WDK layout
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\wdk\c"
          if (-not (Test-Path "$root\Lib\10.0.26100.0\km\x64")) {
              throw "WDK km libraries missing under $root"
          }
          "WDK_ROOT=$root" >> $env:GITHUB_ENV

  build:
    name: build + host tests
    needs: install-toolchain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.8
      - name: Install WDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\wdk" | Out-Null
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$env:WDK_VERSION/microsoft.windows.wdk.x64.$env:WDK_VERSION.nupkg"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\wdk\wdk.nupkg"
          tar.exe -xf "$env:RUNNER_TEMP\wdk\wdk.nupkg" -C "$env:RUNNER_TEMP\wdk"
          "WDK_ROOT=$env:RUNNER_TEMP\wdk\c" >> $env:GITHUB_ENV
      - name: Clone pinned blook-kchannel
        shell: pwsh
        run: |
          git clone $env:KCHANNEL_REPO "$env:GITHUB_WORKSPACE\..\blook-kchannel"
          git -C "$env:GITHUB_WORKSPACE\..\blook-kchannel" checkout $env:KCHANNEL_COMMIT
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\..\blook-kchannel\src\user\kc_user.cpp")) {
              throw "blook-kchannel sources are missing at the pinned commit"
          }
          "KCHANNEL_DIR=$env:GITHUB_WORKSPACE\..\blook-kchannel" >> $env:GITHUB_ENV
      - name: Clone pinned blook-drv-lite
        shell: pwsh
        run: |
          git clone $env:DRVLITE_REPO "$env:GITHUB_WORKSPACE\..\blook-drv-lite"
          git -C "$env:GITHUB_WORKSPACE\..\blook-drv-lite" checkout $env:DRVLITE_COMMIT
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\..\blook-drv-lite\src\driver\entry.cpp")) {
              throw "blook-drv-lite sources are missing at the pinned commit"
          }
          "DRVLITE_DIR=$env:GITHUB_WORKSPACE\..\blook-drv-lite" >> $env:GITHUB_ENV
      - name: Prepare signed embedded driver assets
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/prepare-assets.ps1
      - name: Verify embedded driver assets
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/check-assets.ps1
      - name: Configure
        shell: pwsh
        run: xmake f -y -m release --kchannel_dir="$env:KCHANNEL_DIR" --drvlite_dir="$env:DRVLITE_DIR" --wdk="$env:WDK_ROOT"
      - name: Build (user + payload)
        shell: pwsh
        env:
          SPC_PFX_BASE64: ${{ secrets.SPC_PFX_BASE64 }}
          SPC_PFX_PASSWORD: ${{ secrets.SPC_PFX_PASSWORD }}
        run: xmake -y
      - name: Host unit tests
        shell: pwsh
        run: |
          xmake run kdu_tests
          if ($LASTEXITCODE -ne 0) { throw "host unit tests failed" }
      - name: CLI smoke (no kernel access)
        shell: pwsh
        run: |
          $kdu = "build/windows/x64/release/kdu.exe"
          & $kdu --version
          if ($LASTEXITCODE -ne 0) { throw "kdu --version failed" }
          $exploits = (& $kdu --json exploits list) | ConvertFrom-Json
          if ($exploits.Count -lt 3) { throw "unexpected exploit count: $($exploits.Count)" }
          & $kdu assets verify
          if ($LASTEXITCODE -ne 0) { throw "embedded asset verification failed" }
          & $kdu exploits probe
          if ($LASTEXITCODE -ne 0) { throw "exploits probe failed" }
          & $kdu --help | Out-Host
      - name: Registry + version consistency
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/gen-exploit-registry.ps1
          & pwsh -NoProfile -File scripts/check-version.ps1
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "generated registry/version files are stale" }
      - name: Package artifacts
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/package.ps1 -Configuration release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blook-kdu-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            build/windows/x64/release/kdu.exe
            build/windows/x64/release/kdu_payload.sys
          if-no-files-found: error

  format:
    name: clang-format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "clang-format==20.1.0"
          clang-format --version
      - name: Check formatting
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/format.ps1 -Check

  exploit-tests:
    name: exploit / ${{ matrix.exploit }}
    needs: exploit-list
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.exploit-list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.8
      - name: Install WDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\wdk" | Out-Null
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$env:WDK_VERSION/microsoft.windows.wdk.x64.$env:WDK_VERSION.nupkg"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\wdk\wdk.nupkg"
          tar.exe -xf "$env:RUNNER_TEMP\wdk\wdk.nupkg" -C "$env:RUNNER_TEMP\wdk"
          "WDK_ROOT=$env:RUNNER_TEMP\wdk\c" >> $env:GITHUB_ENV
      - name: Clone pinned blook-kchannel
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item "$env:GITHUB_WORKSPACE\..\blook-kchannel" -Recurse -Force -ErrorAction SilentlyContinue
            git clone $env:KCHANNEL_REPO "$env:GITHUB_WORKSPACE\..\blook-kchannel"
            if ($LASTEXITCODE -eq 0) { break }
            Write-Warning "clone attempt $attempt failed; retrying"
            Start-Sleep -Seconds (10 * $attempt)
          }
          if ($LASTEXITCODE -ne 0) { throw "cannot clone blook-kchannel" }
          git -C "$env:GITHUB_WORKSPACE\..\blook-kchannel" checkout $env:KCHANNEL_COMMIT
          "KCHANNEL_DIR=$env:GITHUB_WORKSPACE\..\blook-kchannel" >> $env:GITHUB_ENV
      - name: Build exploit test only
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            xmake f -y -m release --kchannel_dir="$env:KCHANNEL_DIR" --wdk="$env:WDK_ROOT"
            if ($LASTEXITCODE -eq 0) { break }
            Write-Warning "xmake configure attempt $attempt failed; retrying"
            Start-Sleep -Seconds (10 * $attempt)
          }
          if ($LASTEXITCODE -ne 0) { throw "xmake configure failed after retries" }
          xmake -y "kdu_exploit_test_${{ matrix.exploit }}"
      - name: Run exploit test
        shell: pwsh
        run: |
          xmake run "kdu_exploit_test_${{ matrix.exploit }}"
          if ($LASTEXITCODE -ne 0) { throw "exploit ${{ matrix.exploit }} tests failed" }










  kernel-load-smoke:
    name: kernel load smoke + e2e matrix (real driver, SPC signed)
    needs: install-toolchain
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.8
      - name: Install WDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\wdk" | Out-Null
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$env:WDK_VERSION/microsoft.windows.wdk.x64.$env:WDK_VERSION.nupkg"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\wdk\wdk.nupkg"
          tar.exe -xf "$env:RUNNER_TEMP\wdk\wdk.nupkg" -C "$env:RUNNER_TEMP\wdk"
          "WDK_ROOT=$env:RUNNER_TEMP\wdk\c" >> $env:GITHUB_ENV
      - name: Build minimal smoke driver + client
        shell: pwsh
        run: |
          xmake f -y -m release --wdk="$env:WDK_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "xmake configure failed" }
          xmake -y kdu_ci_smoke_driver
          if ($LASTEXITCODE -ne 0) { throw "smoke driver build failed" }
          xmake -y kdu_ci_smoke_client
          if ($LASTEXITCODE -ne 0) { throw "smoke client build failed" }
      - name: Sign smoke driver with the SPC signer
        shell: pwsh
        env:
          SPC_PFX_BASE64: ${{ secrets.SPC_PFX_BASE64 }}
          SPC_PFX_PASSWORD: ${{ secrets.SPC_PFX_PASSWORD }}
        run: |
          & pwsh -NoProfile -File scripts/sign.ps1 `
              -Files build/windows/x64/release/kdu_ci_smoke_driver.sys `
              -ExportLeafCert build/generated/xinda-leaf.cer
          if ($LASTEXITCODE -ne 0) { throw "driver signing failed" }
      - name: Trust the SPC chain
        shell: pwsh
        run: |
          certutil -addstore -f root signer/tsa/tsa-root.cer
          certutil -addstore -f CA signer/certs/verisign-cscs-2010.cer
          certutil -addstore -f CA signer/certs/verisign-g5-mcvr.cer
          certutil -addstore -f trustedpublisher build/generated/xinda-leaf.cer
      - name: Verify the kernel signature policy
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match "x64" } |
              Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found on the runner" }
          & $signtool verify /kp build/windows/x64/release/kdu_ci_smoke_driver.sys
          if ($LASTEXITCODE -ne 0) { throw "signtool /kp verification failed" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $testsigning = ((bcdedit /enum "{current}" 2>&1 |
              Select-String -Pattern "testsigning").Line | Out-String).Trim()
          if (-not $testsigning) { $testsigning = "absent" }
          [ordered]@{ testsigning = $testsigning; signtool_kp = "pass" } |
              ConvertTo-Json | Set-Content artifacts/ci-signing.json -Encoding UTF8
      - name: Kernel load + full e2e matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $driver = (Resolve-Path "build/windows/x64/release/kdu_ci_smoke_driver.sys").Path
          $client = (Resolve-Path "build/windows/x64/release/kdu_ci_smoke_client.exe").Path
          $results = New-Object System.Collections.Generic.List[object]
          function Add-Case([string] $name, [string] $status, [string] $detail) {
              $results.Add([pscustomobject]@{ name = $name; status = $status; detail = $detail })
              Write-Host ("[{0}] {1}: {2}" -f $status.ToUpper(), $name, $detail)
          }
          function Invoke-Guarded([string] $file, [string[]] $arguments, [int] $seconds) {
              $out = Join-Path $env:TEMP ("guard-" + [guid]::NewGuid() + ".out")
              $p = Start-Process -FilePath $file -ArgumentList $arguments `
                  -NoNewWindow -PassThru -RedirectStandardOutput $out `
                  -RedirectStandardError ($out + ".err")
              if (-not $p.WaitForExit($seconds * 1000)) {
                  try { $p.Kill($true) } catch { }
                  return @{ code = -1; output = "TIMEOUT" }
              }
              return @{ code = $p.ExitCode; output = (Get-Content $out -Raw -ErrorAction SilentlyContinue) }
          }
          function Load-Driver([string] $service) {
              Invoke-Guarded "sc.exe" @("stop", $service) 15 | Out-Null
              Invoke-Guarded "sc.exe" @("delete", $service) 15 | Out-Null
              Start-Sleep -Milliseconds 500
              $create = Invoke-Guarded "sc.exe" @("create", $service, "type=", "kernel",
                  "start=", "demand", "binPath=", $driver) 20
              if ($create.code -ne 0) { return $false }
              $start = Invoke-Guarded "sc.exe" @("start", $service) 30
              return ($start.output -match "RUNNING")
          }
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator)
          Add-Case "environment/elevated" $(if ($admin) { "pass" } else { "fail" }) "administrator token"
          $signing = Get-Content artifacts/ci-signing.json -Raw | ConvertFrom-Json
          Add-Case "signing/signtool-kp" $(if ($signing.signtool_kp -eq "pass") { "pass" } else { "fail" }) ("kp=" + $signing.signtool_kp)
          Add-Case "signing/testsigning" "pass" ("testsigning=" + $signing.testsigning)
          if (Load-Driver "kduCiSmoke") {
              Add-Case "driver/signed-load" "pass" "SPC-signed driver STATE 4 RUNNING"
              $run = Invoke-Guarded $client @() 45
              $doc = $null
              try { $doc = $run.output | ConvertFrom-Json } catch { }
              if ($run.code -eq 0 -and $doc -and $doc.ok -and $doc.canonical) {
                  Add-Case "driver/ioctl-roundtrip" "pass" ("magic=" + $doc.magic + " kernel_pointer=" + $doc.kernel_pointer)
              } else {
                  Add-Case "driver/ioctl-roundtrip" "fail" $run.output
              }
              Invoke-Guarded "sc.exe" @("stop", "kduCiSmoke") 15 | Out-Null
              Invoke-Guarded "sc.exe" @("delete", "kduCiSmoke") 15 | Out-Null
          } else {
              Add-Case "driver/signed-load" "fail" "driver did not start"
              Add-Case "driver/ioctl-roundtrip" "fail" "driver did not start"
          }
          $cycles = 2
          $failures = 0
          for ($index = 0; $index -lt $cycles; $index++) {
              if (-not (Load-Driver "kduCiSmoke")) { $failures++ }
              Invoke-Guarded "sc.exe" @("stop", "kduCiSmoke") 15 | Out-Null
              Invoke-Guarded "sc.exe" @("delete", "kduCiSmoke") 15 | Out-Null
          }
          Add-Case "stress/load-unload" $(if ($failures -eq 0) { "pass" } else { "fail" }) ("{0}x, failures={1}" -f $cycles, $failures)
          Add-Case "exploit/victim-driver-load" "skip" "blocklisted victim driver"
          Add-Case "payload/manual-map" "skip" "manual-map NX on 26200"
          Add-Case "dse/unsigned-load" "skip" "requires VM reboot/BSOD"
          $failed = @($results | Where-Object { $_.status -eq "fail" }).Count
          $passed = @($results | Where-Object { $_.status -eq "pass" }).Count
          $skipped = @($results | Where-Object { $_.status -eq "skip" }).Count
          New-Item -ItemType Directory -Force artifacts | Out-Null
          [ordered]@{
              suite = "blook-kdu-ci-e2e"
              schema = "kdu.e2e.v1"
              runner = $env:COMPUTERNAME
              testsigning = $signing.testsigning
              signtool_kp = $signing.signtool_kp
              elevated = $admin
              total = $results.Count
              passed = $passed
              failed = $failed
              skipped = $skipped
              cases = $results
          } | ConvertTo-Json -Depth 6 | Set-Content artifacts/ci-e2e-result.json -Encoding UTF8
          Write-Host ("matrix: {0} passed, {1} failed, {2} skipped" -f $passed, $failed, $skipped)
          if ($failed -ne 0) { throw "CI e2e matrix failed" }
      - name: Upload CI e2e result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdu-ci-e2e-result
          path: artifacts/ci-e2e-result.json
          if-no-files-found: warn
      - name: Capture code integrity events
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -LogName "Microsoft-Windows-CodeIntegrity/Operational" `
              -MaxEvents 20 -ErrorAction SilentlyContinue |
              Format-Table TimeCreated, Id, LevelDisplayName, Message -AutoSize |
              Out-String | Out-Host
      - name: Cleanup kernel service
        if: always()
        shell: pwsh
        run: |
          sc.exe stop kduCiSmoke 2>&1 | Out-Null
          sc.exe delete kduCiSmoke 2>&1 | Out-Null
          sc.exe query kduCiSmoke 2>&1 | Out-Null
